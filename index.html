<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Panoya Kopyala</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0a0a0a;
                --text-main: #f5f5f5;
                --text-muted: #888888;
                --accent: #ffffff;
                --btn-bg: #1a1a1a;
                --btn-hover: #2a2a2a;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
            }

            body,
            html {
                height: 100%;
                overflow: hidden;
                background-color: var(--bg);
                color: var(--text-main);
                font-family: 'Inter', sans-serif;
            }

            main {
                width: 100vw;
                height: 100vh;
                overflow-y: auto;
                background-color: var(--bg);
                scrollbar-width: none; 
                -ms-overflow-style: none; 
            }

            main::-webkit-scrollbar {
                display: none;
            }

            .content-wrapper {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 20px;
                gap: 24px;
                max-width: 800px;
                margin: 0 auto;
                width: 100%;
            }

            h1 {
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                cursor: pointer;
                color: var(--text-muted);
                transition: color 0.2s ease;
                display: flex;
                align-items: center;
                gap: 10px;
                justify-content: center;
            }

            h1:hover {
                color: var(--accent);
            }

            h1 i {
                font-size: 1.2rem;
                opacity: 0;
                transition: opacity 0.2s ease;
            }

            h1:hover i {
                opacity: 1;
            }
  
            p#copy-box {
                font-size: 1.5rem;
                font-weight: 500;
                line-height: 1.6;
                color: var(--text-main);
                cursor: pointer;
                word-break: break-word;
                transition: opacity 0.2s ease;
                padding: 10px;
                border-radius: 8px;
            }

            p#copy-box:hover {
                opacity: 0.8;
                background: rgba(255, 255, 255, 0.03);
            }

            .actions {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                margin-top: 10px;
            }

            .copy-btn {
                background-color: var(--accent);
                color: var(--bg);
                border: none;
                padding: 14px 32px;
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 10px;
                transition: transform 0.1s ease, filter 0.2s ease;
            }

            .copy-btn:hover {
                filter: brightness(0.9);
            }

            .copy-btn:active {
                transform: scale(0.96);
            }

            .copy-btn.copied {
                background-color: #10b981;
                color: white;
            }

            .quick-actions {
                display: flex;
                gap: 12px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .btn-sub {
                background: var(--btn-bg);
                color: var(--text-main);
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding: 10px 20px;
                border-radius: 50px;
                font-size: 0.9rem;
                font-weight: 500;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                transition: all 0.2s ease;
            }

            .btn-sub:hover {
                background: var(--btn-hover);
                border-color: rgba(255, 255, 255, 0.2);
            }

            footer {
                padding: 24px 20px;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                background-color: var(--bg);
            }

            .credits {
                font-size: 0.85rem;
                color: var(--text-muted);
            }

            .credits a {
                color: var(--text-main);
                text-decoration: none;
                transition: opacity 0.2s;
            }

            .credits a:not(.insta-gradient):hover {
                opacity: 0.7;
            }

            .disclaimer {
                font-size: 0.75rem;
                color: #555555;
                max-width: 400px;
                line-height: 1.4;
            }

            .insta-gradient {
                background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                color: transparent;
                font-weight: 700;
                transition: opacity 0.2s ease;
            }

            .insta-gradient:hover {
                opacity: 0.8;
            }

            @media (max-width: 600px) {
                h1 {
                    font-size: 1.5rem;
                }
                p#copy-box {
                    font-size: 1.25rem;
                }
                h1 i {
                    opacity: 1;
                    font-size: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="content-wrapper">
                <h1 id="page-header" onclick="copyHeader()" title="Başlığı Kopyala">
                    <span id="header-text">Pano Verisi</span>
                </h1>

                <p id="copy-box" onclick="copyTextToClipboard()" title="Kopyalamak için dokunun">
                    Yükleniyor...
                </p>

                <div class="actions">
                    <button id="copy-btn" class="copy-btn" onclick="copyTextToClipboard()">
                        <i class="fa-regular fa-copy"></i>
                        <span id="btn-text">Kopyala</span>
                    </button>

                    <div class="quick-actions">
                        <a id="action-call" class="btn-sub" style="display: none;">
                            <i class="fa-solid fa-phone"></i> Ara
                        </a>
                        <a id="action-whatsapp" class="btn-sub" target="_blank" rel="noopener" style="display: none;">
                            <i class="fa-brands fa-whatsapp"></i> WhatsApp
                        </a>
                        <a id="action-insta" class="btn-sub" target="_blank" rel="noopener" style="display: none;">
                            <i class="fa-brands fa-instagram"></i> Instagram
                        </a>
                    </div>
                </div>
            </div>

            <footer>
                <div class="credits">
                    Made by 
                    <a href="https://www.instagram.com/novice.psd" class="insta-gradient" target="_blank" rel="noopener">Novice</a>
                    &nbsp;— Template By&nbsp;
                    <a href="https://rengan02.github.io" target="_blank" rel="noopener">Rengan</a>
                </div>
                <div class="disclaimer">
                    Bu site sadece metinleri ve iletişim bilgilerini hızlıca panoya kopyalamak amacıyla oluşturulmuş basit bir araçtır.
                </div>
            </footer>
        </main>

        <script>
            const urlParams = new URLSearchParams(window.location.search);

            const headerParam = urlParams.get('h');
            const headerTextEl = document.getElementById('header-text');
            const pageHeader = document.getElementById('page-header');
            let rawHeaderText = '';

            if (headerParam) {
                rawHeaderText = decodeURIComponent(headerParam);
                headerTextEl.textContent = rawHeaderText;
                document.title = `${rawHeaderText} | Pano`;
            } else {
                pageHeader.style.display = 'none';
            }

            const pParam = urlParams.get('p') || window.location.hash.substring(1);
            const boxEl = document.getElementById('copy-box');
            const callBtn = document.getElementById('action-call');
            const waBtn = document.getElementById('action-whatsapp');
            const instaBtn = document.getElementById('action-insta');

            let rawText = '';

            if (pParam) {
                rawText = decodeURIComponent(pParam);
                boxEl.textContent = rawText;

                const cleanPhone = rawText.replace(/[\s\-\(\)\.]/g, '');
                const isPhone = /^\+?[0-9]{10,14}$/.test(cleanPhone);

                if (isPhone) {
                    callBtn.href = `tel:${cleanPhone}`;
                    callBtn.style.display = 'inline-flex';

                    let waNumber = cleanPhone;
                    if (waNumber.startsWith('0') && waNumber.length === 11) {
                        waNumber = '90' + waNumber.substring(1);
                    }
                    waBtn.href = `https://wa.me/${waNumber}`;
                    waBtn.style.display = 'inline-flex';
                }
            } else {
                boxEl.textContent = 'Görüntülenecek veri bulunamadı.';
                boxEl.style.color = 'var(--text-muted)';
            }

            const instaParam = urlParams.get('insta');
            if (instaParam) {
                const cleanInsta = encodeURIComponent(instaParam);
                instaBtn.href = `https://instagram.com/${cleanInsta}`;
                instaBtn.style.display = 'inline-flex';
            }

            function copyHeader() {
                const textToCopy = rawHeaderText || headerTextEl.textContent;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = headerTextEl.textContent;
                    headerTextEl.textContent = 'Kopyalandı!';
                    setTimeout(() => {
                        headerTextEl.textContent = originalText;
                    }, 1500);
                });
            }

            function copyTextToClipboard() {
                if (!rawText) return;

                navigator.clipboard.writeText(rawText).then(() => {
                    const btn = document.getElementById('copy-btn');
                    const btnText = document.getElementById('btn-text');
                    const icon = btn.querySelector('i');

                    btn.classList.add('copied');
                    btnText.textContent = 'Panoya Kopyalandı';
                    icon.className = 'fa-solid fa-check';

                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btnText.textContent = 'Kopyala';
                        icon.className = 'fa-regular fa-copy';
                    }, 2000);
                });
            }
        </script>
    </body>
</html>
